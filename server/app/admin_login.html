<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理员登录 - 条码汇总</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #f6f7f9; color: #1b1f24; }
  form { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
         padding: 28px 24px; width: min(360px, 92vw); display: grid; gap: 12px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p.hint { margin: 0; color: #667085; font-size: 12px; }
  input { padding: 9px 11px; border: 1px solid #d0d5dd; border-radius: 8px;
          font: inherit; background: #fff; color: inherit; }
  button { padding: 9px 14px; border: 1px solid #1f6feb; border-radius: 8px;
           background: #1f6feb; color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  .err { color: #b42318; font-size: 12px; min-height: 18px; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f1216; color: #e6e8eb; }
    form { background: #171b21; border-color: #262c35; }
    input { background: #0f1216; border-color: #303845; }
  }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>管理员登录</h1>
  <p class="hint">口令在服务器上自动生成，查看：<code>data/admin_token.txt</code></p>
  <input id="token" type="password" placeholder="管理员口令" autocomplete="current-password" required>
  <div class="err" id="err"></div>
  <button type="submit" id="btn">登录</button>
</form>

<script>
const $ = (id) => document.getElementById(id);
const err = (m) => { $("err").textContent = m || ""; };

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  err("");
  $("btn").disabled = true;
  try {
    const r = await fetch("/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: $("token").value }),
    });
    if (r.ok) { location.replace("/admin"); return; }
    if (r.status === 429) {
      err("尝试次数过多，请稍后再试");
    } else if (r.status === 401) {
      err("口令错误");
    } else {
      err("登录失败：HTTP " + r.status);
    }
  } catch (e2) {
    err("网络错误：" + e2.message);
  } finally {
    $("btn").disabled = false;
  }
});
</script>
</body>
</html>
