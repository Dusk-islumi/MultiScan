# ============================================================================
# Nginx 站点配置 —— 部署前必须替换 YOUR_SERVER_IP 为你的公网 IP 或域名
#
#   sed -i 's/YOUR_SERVER_IP/你的IP/g' nginx.conf
#
# 本文件依赖 Let's Encrypt 的 IP 证书（走 webroot 验证）。
# 如果用域名，把 ssl_certificate 路径改成对应域名的即可。
# ============================================================================

limit_req_zone $binary_remote_addr zone=scan_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=scan_register:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=scan_conn:10m;
limit_req_zone $binary_remote_addr zone=scan_admin:10m rate=20r/m;

# ---------- HTTP: only ACME challenge + redirect ----------
server {
    listen 80 default_server;
    server_name _;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 308 https://YOUR_SERVER_IP$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl http2 default_server;
    server_name YOUR_SERVER_IP;

    ssl_certificate     /etc/letsencrypt/live/YOUR_SERVER_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_SERVER_IP/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;

    limit_req_status 429;
    limit_conn_status 429;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---------- 控制台：额外限速，并可选限制来源 IP ----------
    # 应用层已要求管理员口令登录，这里再收紧一层扫描面。
    # 若只想自己访问，取消注释并把 IP 换成你的公网出口地址：
    #   allow 203.0.113.10;
    #   deny  all;
    location ^~ /admin {
        limit_req zone=scan_admin burst=10 nodelay;
        limit_conn scan_conn 10;

        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_read_timeout 30s;
    }

    location = /v1/devices/register {
        limit_req zone=scan_register burst=30 nodelay;
        limit_conn scan_conn 10;

        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=scan_api burst=60 nodelay;
        limit_conn scan_conn 20;

        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_read_timeout 30s;
    }
}
