name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

  package:
    name: 构建可安装包
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: 校验页面模板已打进 wheel
        run: |
          python -c "import glob,zipfile,sys; whl=glob.glob('dist/*.whl')[0]; names=zipfile.ZipFile(whl).namelist(); missing=[f for f in ('admin.html','admin_login.html') if not any(n.endswith(f) for n in names)]; sys.exit('wheel 缺少页面模板: %s' % missing) if missing else print('OK:', whl)"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: server/dist/*.whl
