# 通用构建配置（开源仓库默认值）
#
# Windows 中文/非 ASCII 路径的兼容说明见 docs/WINDOWS_NOTES.md。
# 如果你在本机遇到 Gradle 单元测试全部 ClassNotFoundException 或 AGP 拒绝非 ASCII 路径，
# 可以只在本机 `%USERPROFILE%\.gradle\gradle.properties` 里覆盖下面两项，而不是改仓库配置：
#   org.gradle.jvmargs=-Xmx4g -Dfile.encoding=GBK
#   android.overridePathCheck=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
