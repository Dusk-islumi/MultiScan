# NOTE: file.encoding=GBK is REQUIRED on this machine, do not "upgrade" it to UTF-8.
# Reason: repo path contains non-ASCII chars (OneDrive\桌面\OCR). On Windows/JDK17, Gradle
# writes the test-worker classpath into an @argfile encoded with the daemon charset, but the
# JDK17 java.exe launcher decodes @argfiles with the native/ANSI charset (GBK here). UTF-8
# argfile => mojibake classpath => every unit test fails with ClassNotFoundException.
# With GBK the argfile round-trips correctly; Kotlin/AAPT/XML sources stay UTF-8 by spec.
# (compileDebugJavaWithJavac is configured with options.encoding=UTF-8 in build.gradle.kts.)
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=GBK
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Repo lives under a non-ASCII Windows path (OneDrive\桌面\OCR). AGP 8.x refuses to build
# unless this check is overridden; modern AGP/aapt2 handle Unicode paths correctly.
android.overridePathCheck=true
